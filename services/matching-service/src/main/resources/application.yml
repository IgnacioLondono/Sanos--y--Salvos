server:
  port: 8096

spring:
  application:
    name: matching-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sanosysalvos?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    serialization:
      write-big-decimal-as-plain: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:sanos}
    password: ${SPRING_RABBITMQ_PASSWORD:sanos_pwd}

management:
  endpoints:
    web:
      exposure:
        include: health,info

services:
  reportsUrl: ${REPORTS_SERVICE_URL:http://localhost:8093}
  petCatalogUrl: ${PET_CATALOG_SERVICE_URL:http://localhost:8092}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false
  packages-to-scan: com.sanos.matchingservice.controller, com.sanos.matchingservice.dto
