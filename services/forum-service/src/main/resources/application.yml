server:
  port: 8099

spring:
  application:
    name: forum-service
  datasource:
    # Valores por defecto compatibles con XAMPP (root sin password, puerto 3306).
    # Docker usa variables SPRING_DATASOURCE_* del compose.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/db_foro?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false
  packages-to-scan: com.sanos.forumservice.controller, com.sanos.forumservice.dto
