server:
  port: 8091

spring:
  application:
    name: iam-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/db_iam?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info

sanos:
  jwt:
    secret: ${SANOS_JWT_SECRET:sanos-y-salvos-super-secret-key-at-least-32-chars}
    ttl-hours: 4
  admin:
    email: admin@sanosysalvos.cl
    password: Admin#Sanos2026
    display-name: Administrador Sanos y Salvos
    rut: 11111111-1
