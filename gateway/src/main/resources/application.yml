server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost"
              - "http://localhost:8080"
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: "*"
            allowCredentials: false
      routes:
        - id: iam
          uri: ${IAM_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/iam/**
        - id: pet-catalog
          uri: ${PET_CATALOG_SERVICE_URL:http://localhost:8092}
          predicates:
            - Path=/api/pets/**
        - id: reports
          uri: ${REPORTS_SERVICE_URL:http://localhost:8093}
          predicates:
            - Path=/api/reports/**
        - id: geo-zones
          uri: ${GEO_SERVICE_URL:http://localhost:8094}
          predicates:
            - Path=/api/zones/**
        - id: media
          uri: ${MEDIA_SERVICE_URL:http://localhost:8095}
          predicates:
            - Path=/api/media/**
        - id: matching
          uri: ${MATCHING_SERVICE_URL:http://localhost:8096}
          predicates:
            - Path=/api/matching/**
        - id: capacity
          uri: ${CAPACITY_SERVICE_URL:http://localhost:8097}
          predicates:
            - Path=/api/capacity/**
        - id: audit
          uri: ${AUDIT_SERVICE_URL:http://localhost:8098}
          predicates:
            - Path=/api/audit/**
        - id: bff
          uri: ${BFF_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/bff/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

sanos:
  jwt:
    secret: ${SANOS_JWT_SECRET:sanos-y-salvos-super-secret-key-at-least-32-chars}
