server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin, RETAIN_FIRST
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://127.0.0.1:5173"
              - "http://localhost:5500"
              - "http://127.0.0.1:5500"
              - "http://localhost"
              - "http://127.0.0.1"
              - "http://localhost:8080"
              - "http://127.0.0.1:8080"
              - "null"
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: "*"
            allowCredentials: false
      routes:
        # OpenAPI agregado: expone /v3/api-docs de cada microservicio bajo /openapi/{servicio}/**
        - id: openapi-iam
          uri: ${IAM_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/openapi/iam/**
          filters:
            - StripPrefix=2
        - id: openapi-pets
          uri: ${PET_CATALOG_SERVICE_URL:http://localhost:8092}
          predicates:
            - Path=/openapi/pets/**
          filters:
            - StripPrefix=2
        - id: openapi-reports
          uri: ${REPORTS_SERVICE_URL:http://localhost:8093}
          predicates:
            - Path=/openapi/reports/**
          filters:
            - StripPrefix=2
        - id: openapi-geo
          uri: ${GEO_SERVICE_URL:http://localhost:8094}
          predicates:
            - Path=/openapi/geo/**
          filters:
            - StripPrefix=2
        - id: openapi-media
          uri: ${MEDIA_SERVICE_URL:http://localhost:8095}
          predicates:
            - Path=/openapi/media/**
          filters:
            - StripPrefix=2
        - id: openapi-matching
          uri: ${MATCHING_SERVICE_URL:http://localhost:8096}
          predicates:
            - Path=/openapi/matching/**
          filters:
            - StripPrefix=2
        - id: openapi-capacity
          uri: ${CAPACITY_SERVICE_URL:http://localhost:8097}
          predicates:
            - Path=/openapi/capacity/**
          filters:
            - StripPrefix=2
        - id: openapi-audit
          uri: ${AUDIT_SERVICE_URL:http://localhost:8098}
          predicates:
            - Path=/openapi/audit/**
          filters:
            - StripPrefix=2
        - id: openapi-bff
          uri: ${BFF_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/openapi/bff/**
          filters:
            - StripPrefix=2
        - id: iam
          uri: ${IAM_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/iam/**
        - id: pet-catalog
          uri: ${PET_CATALOG_SERVICE_URL:http://localhost:8092}
          predicates:
            - Path=/api/pets/**
        - id: reports
          uri: ${REPORTS_SERVICE_URL:http://localhost:8093}
          predicates:
            - Path=/api/reports/**
        - id: geo-zones
          uri: ${GEO_SERVICE_URL:http://localhost:8094}
          predicates:
            - Path=/api/zones/**
        - id: media
          uri: ${MEDIA_SERVICE_URL:http://localhost:8095}
          predicates:
            - Path=/api/media/**
        - id: matching
          uri: ${MATCHING_SERVICE_URL:http://localhost:8096}
          predicates:
            - Path=/api/matching/**
        - id: capacity
          uri: ${CAPACITY_SERVICE_URL:http://localhost:8097}
          predicates:
            - Path=/api/capacity/**
        - id: audit
          uri: ${AUDIT_SERVICE_URL:http://localhost:8098}
          predicates:
            - Path=/api/audit/**
        - id: bff
          uri: ${BFF_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/bff/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreaker-events
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  # Logs detallados del Circuit Breaker
logging:
  level:
    io.github.resilience4j: DEBUG
    com.sanos.gateway: INFO

sanos:
  jwt:
    secret: ${SANOS_JWT_SECRET:sanos-y-salvos-super-secret-key-at-least-32-chars}

# Swagger UI unificado: selector con los OpenAPI de los 9 backends (8 MS + BFF).
# Ver documentacion SpringDoc: agregacion de specs externos vía springdoc.swagger-ui.urls
springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    urlsPrimaryName: "IAM"
    urls:
      - name: "IAM"
        url: /openapi/iam/v3/api-docs
      - name: "Catalogo mascotas"
        url: /openapi/pets/v3/api-docs
      - name: "Reportes"
        url: /openapi/reports/v3/api-docs
      - name: "Geo (zonas)"
        url: /openapi/geo/v3/api-docs
      - name: "Media"
        url: /openapi/media/v3/api-docs
      - name: "Matching IA"
        url: /openapi/matching/v3/api-docs
      - name: "Capacity"
        url: /openapi/capacity/v3/api-docs
      - name: "Auditoria"
        url: /openapi/audit/v3/api-docs
      - name: "BFF"
        url: /openapi/bff/v3/api-docs

# Configuración de Resilience4j para Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      serviceCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      
      criticalServiceCircuitBreaker:
        slidingWindowSize: 8
        failureRateThreshold: 30
        slowCallRateThreshold: 40
        slowCallDurationThreshold: 1s
        waitDurationInOpenState: 45s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
    
    metrics:
      enabled: true
      publishBaselineMetrics: true
