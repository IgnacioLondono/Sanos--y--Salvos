server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # URLs cortas -> pages/ (sin archivos sueltos en la raiz)
    location ~ ^/citizen-.+\.html$ {
        rewrite ^/(citizen-.+\.html)$ /pages/citizen/$1 permanent;
    }
    location ~ ^/admin-.+\.html$ {
        rewrite ^/(admin-.+\.html)$ /pages/admin/$1 permanent;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(html|js|css|svg)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
