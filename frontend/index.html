<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sanos y Salvos | Login</title>
  <meta
    name="description"
    content="Login ciudadano de Sanos y Salvos."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="ambient ambient-c"></div>

  <div class="auth-viewport">
    <section class="auth-card reveal">
      <div class="brand-lockup auth-brand">
        <img class="brand-logo" src="./src/logo.svg" alt="Logo de Sanos y Salvos" />
        <div>
          <h1 class="auth-title">Sanos y Salvos</h1>
          <p class="auth-subtitle">Acceso ciudadano</p>
        </div>
      </div>

      <div class="form-grid one-col">
        <label class="field">
          <span>Correo</span>
          <input id="email" type="email" placeholder="tu-correo@dominio.cl" />
        </label>
        <label class="field">
          <span>Contrasena</span>
          <input id="password" type="password" placeholder="Tu contrasena" />
        </label>
      </div>

      <div class="action-row auth-actions">
        <button id="btnLogin" class="btn btn-primary">Iniciar sesion</button>
      </div>

      <p id="authStatus" class="inline-feedback">Ingresa tus credenciales para continuar</p>

      <div class="auth-links">
        <a href="./register.html">Crear cuenta nueva</a>
      </div>
    </section>
  </div>

  <script src="./src/config.js"></script>
  <script src="./src/shared.js"></script>
  <script src="./src/index-auth.js"></script>
</body>
</html>
