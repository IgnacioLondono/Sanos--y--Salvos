<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sanos y Salvos | Entrar</title>
  <link rel="icon" type="image/png" href="./assets/images/favicon.png" />
  <meta name="description" content="Inicio de sesion en Sanos y Salvos." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="./assets/css/styles.css" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("sanos-theme");
        document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
      var q = new URLSearchParams(window.location.search);
      if (q.has("logout") || q.has("cerrar")) {
        try {
          localStorage.removeItem("sanos-session");
          localStorage.removeItem("sanos-admin-session");
        } catch (e) {}
        window.history.replaceState({}, "", "index.html");
      }
      window.SANOS_LOGIN_NO_AUTO_REDIRECT = true;
    })();
  </script>
</head>
<body class="auth-page">
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>

  <div class="auth-viewport auth-viewport-compact">
    <section class="auth-card auth-card-min glass-card reveal">
      <div class="auth-headline">
        <div class="auth-brand-ico" aria-hidden="true">
          <img class="brand-logo" src="./assets/images/logo.png" alt="Sanos y Salvos" width="44" height="44" />
        </div>
        <div>
          <h1 class="auth-title">Entrar</h1>
          <p class="auth-note">Ingresa tus credenciales</p>
        </div>
      </div>

      <div class="form-grid one-col form-grid-compact">
        <label class="field">
          <span>Correo</span>
          <div class="input-ico-wrap">
            <i data-lucide="mail" aria-hidden="true"></i>
            <input id="email" type="email" placeholder="correo@ejemplo.cl" autocomplete="email" />
          </div>
        </label>
        <label class="field">
          <span>Contrasena</span>
          <div class="input-ico-wrap">
            <i data-lucide="lock" aria-hidden="true"></i>
            <input id="password" type="password" placeholder="········" autocomplete="current-password" />
          </div>
        </label>
      </div>

      <div class="action-row auth-actions">
        <button id="btnLogin" class="btn btn-primary" type="button">
          <i data-lucide="log-in" class="btn-ico" aria-hidden="true"></i>
          Continuar
        </button>
      </div>

      <p id="authStatus" class="auth-status-line" role="status"></p>

      <div class="auth-links auth-links-center">
        <a href="./register.html"><i data-lucide="user-plus" aria-hidden="true"></i>Crear cuenta</a>
      </div>
    </section>
  </div>

  <button type="button" class="btn-theme btn-theme--fab js-theme-toggle" aria-label="Cambiar tema">
    <i data-lucide="moon" class="btn-theme__icon-dark" aria-hidden="true"></i>
    <i data-lucide="sun" class="btn-theme__icon-light" aria-hidden="true"></i>
  </button>

  <script src="./src/core/paths.js"></script>
  <script src="./src/core/config.js"></script>
  <script src="./src/core/shared.js"></script>
  <script src="./src/ui/theme-ui.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="./src/auth/index-auth.js"></script>
  <script>
    if (window.lucide) lucide.createIcons();
    if (window.SANOS_THEME) window.SANOS_THEME.init();
  </script>
</body>
</html>
