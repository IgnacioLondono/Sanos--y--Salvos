<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Actividad | Ciudadano</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/styles.css" />
  <link rel="stylesheet" href="./src/styles-enhanced.css" />
  <link rel="stylesheet" href="./src/dash-sidebar.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("sanos-theme");
        document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
</head>
<body class="dash-page citizen-page" data-citizen-page="actividad">
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="ambient ambient-c"></div>

  <div class="dash-root">
    <header class="dash-header">
      <div class="dash-header-inner">
        <a class="dash-brand" href="./index.html">
          <img class="dash-brand__logo" src="./src/logo.svg" alt="" width="46" height="46" />
          <div class="dash-brand__text">
            <span class="dash-brand__kicker">Sanos y salvos</span>
            <strong class="dash-brand__title">Ciudadano</strong>
          </div>
        </a>
        <nav class="dash-nav" aria-hidden="true"></nav>
        <div class="dash-header-end">
          <button type="button" class="btn-theme js-theme-toggle" id="btnThemeToggle" aria-label="Cambiar tema">
            <i data-lucide="moon" class="btn-theme__icon-dark" aria-hidden="true"></i>
            <i data-lucide="sun" class="btn-theme__icon-light" aria-hidden="true"></i>
          </button>
          <div class="dash-user">
            <div class="dash-user__avatar" aria-hidden="true"><i data-lucide="user"></i></div>
            <div class="dash-user__meta">
              <div class="dash-user__name" id="citizenIdentity">—</div>
              <span class="sync-pill" id="citizenStatus" role="status"></span>
            </div>
          </div>
          <div class="dash-actions">
            <button class="btn btn-secondary" type="button" id="btnRefresh"><i data-lucide="refresh-cw" class="btn-ico" aria-hidden="true"></i>Actualizar</button>
            <button class="btn btn-primary" type="button" id="btnCitizenLogout"><i data-lucide="log-out" class="btn-ico" aria-hidden="true"></i>Cerrar sesión</button>
          </div>
        </div>
      </div>
    </header>

    <main class="dash-main page-grid">
      <section class="glass-card section section-compact reveal">
        <div class="section-head-min">
          <div class="section-head-min__title">
            <i data-lucide="inbox" aria-hidden="true"></i>
            <h2>Actividad reciente</h2>
          </div>
        </div>
        <div class="insight-grid">
          <article class="insight-card">
            <div class="insight-header"><h3><i data-lucide="paw-print" aria-hidden="true"></i>Mascotas</h3></div>
            <div id="petsList" class="stack-list"></div>
          </article>
          <article class="insight-card">
            <div class="insight-header"><h3><i data-lucide="file-text" aria-hidden="true"></i>Reportes</h3></div>
            <div id="reportsList" class="stack-list"></div>
          </article>
          <article class="insight-card">
            <div class="insight-header"><h3><i data-lucide="sparkles" aria-hidden="true"></i>Coincidencias</h3></div>
            <div id="matchingList" class="stack-list"></div>
          </article>
        </div>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="./src/config.js"></script>
  <script src="./src/shared.js"></script>
  <script src="./src/theme-ui.js"></script>
  <script src="./src/dash-layout.js"></script>
  <script src="./src/citizen-dashboard.js"></script>
  <script>
    if (window.SANOS_DASH_LAYOUT) window.SANOS_DASH_LAYOUT.init();
    if (window.lucide) lucide.createIcons();
    if (window.SANOS_THEME) window.SANOS_THEME.init();
  </script>
</body>
</html>
