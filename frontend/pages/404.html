<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("sanos-theme");
        document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
      } catch (e) {}
    })();
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      color: var(--text, #0f172a);
      background: var(--bg, #f8fafc);
    }
    .nf {
      text-align: center;
      padding: 2rem;
    }
    .nf h1 {
      margin: 0;
      font-size: 4rem;
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .nf p {
      margin: 0.5rem 0 0;
      font-size: 1.1rem;
      color: var(--text-soft, #64748b);
    }
  </style>
</head>
<body>
  <div class="nf">
    <h1>404</h1>
    <p>Página no encontrada</p>
  </div>
</body>
</html>
