<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usuarios | Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <link rel="stylesheet" href="../../assets/css/styles-enhanced.css" />
  <link rel="stylesheet" href="../../assets/css/dash-sidebar.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("sanos-theme");
        document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
</head>
<body class="dash-page admin-page" data-admin-page="usuarios">
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="ambient ambient-c"></div>

  <!-- Modal de Perfil de Usuario -->
  <div id="userProfileModal" class="modal-overlay hidden">
    <div class="modal-content modal-profile glass-card">
      <button class="modal-close" type="button" id="btnCloseProfile" aria-label="Cerrar">
        <i data-lucide="x" aria-hidden="true"></i>
      </button>
      
      <div class="profile-header">
        <div class="profile-avatar-large">
          <i data-lucide="shield" aria-hidden="true"></i>
        </div>
        <div>
          <h2 id="profileDisplayName" class="profile-name">Admin</h2>
          <p id="profileEmail" class="profile-email">admin@ejemplo.cl</p>
          <span id="profileRole" class="badge badge-admin">Administrador</span>
        </div>
      </div>

      <div class="profile-section">
        <h3>Información</h3>
        <div class="profile-info-grid">
          <div class="info-item">
            <span class="info-label">Correo</span>
            <p id="profileEmailFull">admin@ejemplo.cl</p>
          </div>
          <div class="info-item">
            <span class="info-label">Teléfono</span>
            <p id="profilePhone">—</p>
          </div>
        </div>
      </div>

      <div class="profile-footer">
        <button id="btnProfileLogout" class="btn btn-primary" type="button" style="width: 100%;">
          <i data-lucide="log-out" aria-hidden="true"></i>
          Cerrar Sesión
        </button>
      </div>
    </div>
  </div>

  <div class="dash-root">
    <header class="dash-header">
      <div class="dash-header-inner">
        <a class="dash-brand" href="../../index.html">
          <img class="dash-brand__logo" src="../../assets/images/logo.svg" alt="" width="46" height="46" />
          <div class="dash-brand__text">
            <span class="dash-brand__kicker">Sanos y salvos</span>
            <strong class="dash-brand__title">Admin</strong>
          </div>
        </a>
        <nav class="dash-nav" aria-label="Admin">
          <a class="sidebar-link dash-nav__link" href="admin-resumen.html"><i data-lucide="activity" class="sidebar-link-icon" aria-hidden="true"></i>Resumen</a>
          <a class="sidebar-link dash-nav__link" href="admin-usuarios.html"><i data-lucide="users" class="sidebar-link-icon" aria-hidden="true"></i>Usuarios</a>
          <a class="sidebar-link dash-nav__link" href="admin-reportes.html"><i data-lucide="file-text" class="sidebar-link-icon" aria-hidden="true"></i>Reportes</a>
          <a class="sidebar-link dash-nav__link" href="admin-capacity.html"><i data-lucide="users-round" class="sidebar-link-icon" aria-hidden="true"></i>Capacity</a>
          <a class="sidebar-link dash-nav__link" href="admin-mapa.html"><i data-lucide="map" class="sidebar-link-icon" aria-hidden="true"></i>Mapa</a>
          <a class="sidebar-link dash-nav__link" href="admin-matching.html"><i data-lucide="sparkles" class="sidebar-link-icon" aria-hidden="true"></i>Matching</a>
          <a class="sidebar-link dash-nav__link" href="admin-auditoria.html"><i data-lucide="scroll-text" class="sidebar-link-icon" aria-hidden="true"></i>Auditoria</a>
        </nav>
        <div class="dash-header-end">
          <button type="button" class="btn-theme js-theme-toggle" id="btnAdminThemeToggle" aria-label="Cambiar tema">
            <i data-lucide="moon" class="btn-theme__icon-dark" aria-hidden="true"></i>
            <i data-lucide="sun" class="btn-theme__icon-light" aria-hidden="true"></i>
          </button>
          <div class="dash-user">
            <div class="dash-user__avatar" aria-hidden="true"><i data-lucide="shield"></i></div>
            <div class="dash-user__meta">
              <div class="dash-user__name" id="adminIdentity">—</div>
              <span class="sync-pill" id="adminStatus" role="status"></span>
            </div>
          </div>
          <div class="dash-actions">
            <a class="btn btn-ghost" href="../../index.html"><i data-lucide="home" class="btn-ico" aria-hidden="true"></i>Inicio</a>
            <button class="btn btn-secondary" type="button" id="btnAdminRefresh"><i data-lucide="refresh-cw" class="btn-ico" aria-hidden="true"></i>Actualizar</button>
            <button class="btn btn-primary" type="button" id="btnAdminLogout"><i data-lucide="log-out" class="btn-ico" aria-hidden="true"></i>Salir</button>
          </div>
        </div>
      </div>
    </header>

    <main class="dash-main page-grid">
      <section class="glass-card section reveal">
        <div class="section-head-min">
          <div class="section-head-min__title">
            <i data-lucide="users" aria-hidden="true"></i>
            <h2>Gestión de Usuarios</h2>
          </div>
          <div class="operation-toolbar">
            <button class="btn btn-secondary" type="button" id="btnRefreshUsers">
              <i data-lucide="refresh-cw" aria-hidden="true"></i>
              Actualizar
            </button>
          </div>
        </div>
        
        <div id="usersContainer" class="users-grid">
          <!-- Las tarjetas de usuarios se cargarán aquí -->
        </div>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="../../src/core/paths.js"></script>
  <script src="../../src/core/config.js"></script>
  <script src="../../src/core/shared.js"></script>
  <script src="../../src/ui/theme-ui.js"></script>
  <script src="../../src/layout/dash-layout.js"></script>
  <script src="../../src/profile/user-profile.js"></script>
  <script src="../../src/admin/admin-dashboard.js"></script>
  <script>
    if (window.SANOS_DASH_LAYOUT) window.SANOS_DASH_LAYOUT.init();
    if (window.lucide) lucide.createIcons();
    if (window.SANOS_THEME) window.SANOS_THEME.init();
  </script>
</body>
</html>
