<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foro | Ciudadano</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <link rel="stylesheet" href="../../assets/css/styles-enhanced.css" />
  <link rel="stylesheet" href="../../assets/css/dash-sidebar.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("sanos-theme");
        document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
</head>
<body class="dash-page citizen-page" data-citizen-page="foro">
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>

  <div class="dash-root">
    <header class="dash-header">
      <div class="dash-header-inner">
        <a class="dash-brand" href="./citizen-reporte.html">
          <img class="dash-brand__logo" src="../../assets/images/logo.svg" alt="" width="46" height="46" />
          <div class="dash-brand__text">
            <span class="dash-brand__kicker">Sanos y salvos</span>
            <strong class="dash-brand__title">Ciudadano</strong>
          </div>
        </a>
        <nav class="dash-nav" aria-hidden="true"></nav>
        <div class="dash-header-end">
          <button type="button" class="btn-theme js-theme-toggle" id="btnThemeToggle" aria-label="Cambiar tema">
            <i data-lucide="moon" class="btn-theme__icon-dark" aria-hidden="true"></i>
            <i data-lucide="sun" class="btn-theme__icon-light" aria-hidden="true"></i>
          </button>
          <div class="dash-user">
            <div class="dash-user__avatar" aria-hidden="true"><i data-lucide="user"></i></div>
            <div class="dash-user__meta">
              <div class="dash-user__name" id="citizenIdentity">—</div>
              <span class="sync-pill" id="citizenStatus" role="status"></span>
            </div>
          </div>
          <div class="dash-actions">
            <button class="btn btn-secondary" type="button" id="btnRefresh">
              <i data-lucide="refresh-cw" class="btn-ico" aria-hidden="true"></i>Actualizar
            </button>
            <button class="btn btn-primary" type="button" id="btnCitizenLogout">
              <i data-lucide="log-out" class="btn-ico" aria-hidden="true"></i>Cerrar sesión
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="dash-main forum-page">
      <section class="forum-shell glass-card">
        <header class="forum-shell__head">
          <div>
            <p class="report-page__tag">Comunidad</p>
            <h2 class="report-page__title">Foro de ayuda</h2>
            <p class="report-page__lead">Comparte experiencias, pide ayuda y responde a otros ciudadanos.</p>
          </div>
          <button type="button" class="btn btn-primary" id="btnNewThread">
            <i data-lucide="plus" class="btn-ico" aria-hidden="true"></i>Nuevo hilo
          </button>
        </header>

        <div class="forum-toolbar">
          <label class="field forum-filter">
            <span>Categoría</span>
            <select id="forumCategoryFilter">
              <option value="">Todas</option>
              <option value="AYUDA">Ayuda</option>
              <option value="CONSEJOS">Consejos</option>
              <option value="GENERAL">General</option>
            </select>
          </label>
          <button type="button" class="btn btn-ghost" id="btnBackToList" hidden>
            <i data-lucide="arrow-left" class="btn-ico" aria-hidden="true"></i>Volver al listado
          </button>
        </div>

        <div id="forumViewList" class="forum-view">
          <div id="forumThreadList" class="forum-thread-list" aria-live="polite"></div>
          <p id="forumEmpty" class="forum-empty hidden">No hay hilos en esta categoría. ¡Sé el primero en publicar!</p>
        </div>

        <div id="forumViewThread" class="forum-view hidden">
          <article class="forum-thread-detail">
            <header id="forumThreadHeader" class="forum-thread-detail__head"></header>
            <div id="forumPostsList" class="forum-posts"></div>
            <form id="forumReplyForm" class="forum-reply-form">
              <label class="field field-block">
                <span>Tu respuesta</span>
                <textarea id="forumReplyContent" rows="4" placeholder="Escribe un comentario de ayuda..."></textarea>
              </label>
              <div class="report-form__actions report-form__actions--inline">
                <button class="btn btn-primary" type="submit">
                  <i data-lucide="send" class="btn-ico" aria-hidden="true"></i>Publicar respuesta
                </button>
              </div>
            </form>
          </article>
        </div>

        <div id="forumViewNew" class="forum-view hidden">
          <form id="forumNewThreadForm" class="forum-new-form">
            <h3 class="forum-new-form__title"><i data-lucide="pen-line" aria-hidden="true"></i>Crear nuevo hilo</h3>
            <div class="report-form__grid report-form__grid--wide">
              <label class="field field-span-2">
                <span>Título</span>
                <input id="forumNewTitle" type="text" placeholder="Ej. ¿Cómo subo una foto al reporte?" required />
              </label>
              <label class="field">
                <span>Categoría</span>
                <select id="forumNewCategory">
                  <option value="AYUDA">Ayuda</option>
                  <option value="CONSEJOS">Consejos</option>
                  <option value="GENERAL">General</option>
                </select>
              </label>
            </div>
            <label class="field field-block">
              <span>Mensaje</span>
              <textarea id="forumNewContent" rows="6" placeholder="Describe tu consulta o experiencia con detalle..." required></textarea>
            </label>
            <div class="report-form__actions report-form__actions--inline">
              <button class="btn btn-ghost" type="button" id="btnCancelNewThread">Cancelar</button>
              <button class="btn btn-primary" type="submit">
                <i data-lucide="send" class="btn-ico" aria-hidden="true"></i>Publicar hilo
              </button>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="../../src/core/paths.js"></script>
  <script src="../../src/core/config.js"></script>
  <script src="../../src/core/shared.js"></script>
  <script src="../../src/ui/theme-ui.js"></script>
  <script src="../../src/layout/dash-layout.js"></script>
  <script src="../../src/citizen/citizen-forum.js"></script>
  <script>
    if (window.SANOS_DASH_LAYOUT) window.SANOS_DASH_LAYOUT.init();
    if (window.lucide) lucide.createIcons();
    if (window.SANOS_THEME) window.SANOS_THEME.init();
  </script>
</body>
</html>
