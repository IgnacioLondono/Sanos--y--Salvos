<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa | Ciudadano</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <link rel="stylesheet" href="../../assets/css/styles-enhanced.css" />
  <link rel="stylesheet" href="../../assets/css/dash-sidebar.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("sanos-theme");
        document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
</head>
<body class="dash-page citizen-page" data-citizen-page="mapa">
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="ambient ambient-c"></div>

  <div class="dash-root">
    <header class="dash-header">
      <div class="dash-header-inner">
        <a class="dash-brand" href="../../index.html">
          <img class="dash-brand__logo" src="../../assets/images/logo.png" alt="" width="46" height="46" />
          <div class="dash-brand__text">
            <span class="dash-brand__kicker">Sanos y salvos</span>
            <strong class="dash-brand__title">Ciudadano</strong>
          </div>
        </a>
        <nav class="dash-nav" aria-hidden="true"></nav>
        <div class="dash-header-end">
          <button type="button" class="btn-theme js-theme-toggle" id="btnThemeToggle" aria-label="Cambiar tema">
            <i data-lucide="moon" class="btn-theme__icon-dark" aria-hidden="true"></i>
            <i data-lucide="sun" class="btn-theme__icon-light" aria-hidden="true"></i>
          </button>
          <div class="dash-user">
            <div class="dash-user__avatar" aria-hidden="true"><i data-lucide="user"></i></div>
            <div class="dash-user__meta">
              <div class="dash-user__name" id="citizenIdentity">—</div>
              <span class="sync-pill" id="citizenStatus" role="status"></span>
            </div>
          </div>
          <div class="dash-actions">
            <button class="btn btn-secondary" type="button" id="btnRefresh"><i data-lucide="refresh-cw" class="btn-ico" aria-hidden="true"></i>Actualizar</button>
            <button class="btn btn-primary" type="button" id="btnCitizenLogout"><i data-lucide="log-out" class="btn-ico" aria-hidden="true"></i>Cerrar sesión</button>
          </div>
        </div>
      </div>
    </header>

    <main class="dash-main page-grid">
      <section class="glass-card section section-compact reveal">
        <div class="section-head-min">
          <div class="section-head-min__title">
            <i data-lucide="map" aria-hidden="true"></i>
            <h2>Mapa de reportes</h2>
          </div>
          <div class="section-head-extras">
            <span class="map-hint"><i data-lucide="mouse-pointer-2" aria-hidden="true"></i>Clic: guarda coordenadas para el reporte</span>
            <a class="btn btn-ghost section-head-link" href="citizen-reporte.html">Hacer reporte</a>
          </div>
        </div>
        <div id="citizenMap" class="map-canvas"></div>
        <div class="map-legend">
          <span class="legend-item"><i data-lucide="circle" style="color:#dc2626" aria-hidden="true"></i>Perdida</span>
          <span class="legend-item"><i data-lucide="circle" style="color:#16a34a" aria-hidden="true"></i>Encontrada</span>
          <span class="legend-item"><i data-lucide="circle" style="color:#f59e0b" aria-hidden="true"></i>Seleccion</span>
        </div>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="../../src/core/paths.js"></script>
  <script src="../../src/core/config.js"></script>
  <script src="../../src/core/shared.js"></script>
  <script src="../../src/core/google-maps.js"></script>
  <script src="../../src/ui/theme-ui.js"></script>
  <script src="../../src/layout/dash-layout.js"></script>
  <script src="../../src/citizen/citizen-dashboard.js"></script>
  <script>
    if (window.SANOS_DASH_LAYOUT) window.SANOS_DASH_LAYOUT.init();
    if (window.lucide) lucide.createIcons();
    if (window.SANOS_THEME) window.SANOS_THEME.init();
  </script>
</body>
</html>
